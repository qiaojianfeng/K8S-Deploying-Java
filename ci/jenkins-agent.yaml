apiVersion: v1
kind: Pod
metadata:
  labels:
    workload: jenkins-build
spec:
  serviceAccountName: ${DEPLOY_SERVICE_ACCOUNT}
  automountServiceAccountToken: false
  restartPolicy: Never
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  securityContext:
    runAsNonRoot: true
    runAsUser: ${POD_RUN_AS_USER}
    runAsGroup: ${POD_RUN_AS_GROUP}
    fsGroup: ${POD_FS_GROUP}
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: jnlp
      image: ${JNLP_IMAGE}
      imagePullPolicy: IfNotPresent
      workingDir: ${JNLP_WORKING_DIR}
      envFrom:
        - configMapRef:
            name: ${BUILD_PROXY_CONFIG_MAP}
      securityContext:
        runAsNonRoot: true
        runAsUser: ${POD_RUN_AS_USER}
        runAsGroup: ${POD_RUN_AS_GROUP}
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

    - name: maven
      image: ${MAVEN_IMAGE}
      imagePullPolicy: IfNotPresent
      command:
        - cat
      tty: true
      env:
        - name: HOME
          value: ${MAVEN_USER_HOME}
        - name: MAVEN_CONFIG
          value: ${MAVEN_CONFIG}
        - name: MAVEN_OPTS
          value: >-
            -Duser.home=${MAVEN_USER_HOME} -Dmaven.repo.local=${MAVEN_REPOSITORY}
            -XX:MaxRAMPercentage=75.0 -Dhttp.proxyHost=192.168.123.44
            -Dhttp.proxyPort=7897 -Dhttps.proxyHost=192.168.123.44
            -Dhttps.proxyPort=7897
      resources:
        requests:
          cpu: "${MAVEN_CPU_REQUEST}"
          memory: "${MAVEN_MEMORY_REQUEST}"
        limits:
          cpu: "${MAVEN_CPU_LIMIT}"
          memory: "${MAVEN_MEMORY_LIMIT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${POD_RUN_AS_USER}
        runAsGroup: ${POD_RUN_AS_GROUP}
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: maven-home
          mountPath: ${MAVEN_USER_HOME}
        - name: maven-cache
          mountPath: ${MAVEN_REPOSITORY}

    - name: buildkit
      image: ${BUILDKIT_IMAGE}
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - cat
      tty: true
      env:
        - name: BUILDKITD_FLAGS
          value: >-
            ${BUILDKITD_FLAGS} --root ${BUILDKIT_STATE_DIR}
        - name: DOCKER_CONFIG
          value: ${BUILDKIT_DOCKER_CONFIG}
        - name: HTTP_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: HTTP_PROXY
        - name: HTTPS_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: HTTPS_PROXY
        - name: NO_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: NO_PROXY
      securityContext:
        runAsNonRoot: true
        runAsUser: ${BUILDKIT_RUN_AS_USER}
        runAsGroup: ${BUILDKIT_RUN_AS_GROUP}
        allowPrivilegeEscalation: true
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
        capabilities:
          add:
            - SETUID
            - SETGID
          drop:
            - ALL
      resources:
        requests:
          cpu: "${IMAGE_BUILDER_CPU_REQUEST}"
          memory: "${IMAGE_BUILDER_MEMORY_REQUEST}"
        limits:
          cpu: "${IMAGE_BUILDER_CPU_LIMIT}"
          memory: "${IMAGE_BUILDER_MEMORY_LIMIT}"
      volumeMounts:
        - name: buildkit-config
          mountPath: ${BUILDKIT_DOCKER_CONFIG}
          readOnly: true
        - name: buildkit-state
          mountPath: ${BUILDKIT_STATE_DIR}

    - name: helm
      image: ${HELM_IMAGE}
      imagePullPolicy: IfNotPresent
      command:
        - cat
      tty: true
      env:
        - name: HOME
          value: ${HELM_USER_HOME}
        - name: HELM_DRIVER
          value: ${HELM_DRIVER}
      resources:
        requests:
          cpu: "${HELM_CPU_REQUEST}"
          memory: "${HELM_MEMORY_REQUEST}"
        limits:
          cpu: "${HELM_CPU_LIMIT}"
          memory: "${HELM_MEMORY_LIMIT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${POD_RUN_AS_USER}
        runAsGroup: ${POD_RUN_AS_GROUP}
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: helm-home
          mountPath: ${HELM_USER_HOME}
        - name: ${HELM_OVERRIDE_VOLUME_NAME}
          mountPath: ${HELM_OVERRIDE_MOUNT_PATH}
          readOnly: true
        - name: deploy-api
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true

  volumes:
    - name: maven-home
      emptyDir: {}
    - name: maven-cache
      persistentVolumeClaim:
        claimName: ${MAVEN_CACHE_CLAIM}
    - name: helm-home
      emptyDir: {}
    - name: ${HELM_OVERRIDE_VOLUME_NAME}
      configMap:
        name: ${HELM_OVERRIDE_CONFIG_MAP}
        optional: true
    - name: buildkit-config
      secret:
        secretName: ${BUILDKIT_REGISTRY_SECRET_NAME}
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: buildkit-state
      emptyDir: {}
    - name: deploy-api
      projected:
        defaultMode: 420
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
